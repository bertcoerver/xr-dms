[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xr_dms"
dynamic = ["version"]
description = "A lazy, chunked implementation of the Data Mining Sharpener"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Bert Coerver", email = "b.coerver@mailbox.org"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "dask",
    "scikit-learn",
    # Swath support: geolocation transforms and the neighbour search behind
    # SwathGridMap. Install from conda-forge in a conda environment -- see the
    # install note in the README.
    "pyproj",
    "pyresample",
]

[project.optional-dependencies]
# Only harmonize_features' fallback path needs this, and only for bands whose
# grids do not nest. Nested grids (Sentinel-2's 10/20/60 m) resample by pure
# index arithmetic and pull in nothing extra.
reproject = [
    "xr_utils",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
dev = [
    "xr_dms[test]",
    "ipython>=8.0",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]
# pytest's importlib import mode does not put the test directory on sys.path, so
# say so explicitly and let the test modules share `scenes.py`.
pythonpath = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
