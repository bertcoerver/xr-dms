name: Tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Matches requires-python in pyproject.toml.
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest 
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: test-env
          use-mamba: true 

      # pyresample's pip wheel vendors its own libomp via pykdtree, which clashes
      # with the OpenMP runtime a conda environment already has and aborts the
      # KD-tree search. Take both from conda-forge so they share one runtime.
      - name: Install pyresample via Conda
        run: conda run -n test-env conda install -y -c conda-forge pyresample pykdtree

      - name: Install package dependencies
        run: conda run -n test-env pip install -e .[test]

      - name: Run tests
        run: conda run -n test-env pytest -v